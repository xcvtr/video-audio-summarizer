vosk:
  model_path: "./vosk/model-ru"
  # Режим работы: "local" - локальная модель VOSK (CPU), "server" - через сервер, "whisper" - faster-whisper (GPU/CPU)
  mode: "whisper"
  # Настройки для серверного режима
  server:
    url: "http://127.0.0.1:8000"
    timeout: 300  # секунды
  # Настройки для режима "whisper" (faster-whisper, работает на GPU)
  whisper:
    model_size: "small"     # tiny / base / small / medium / large-v3
    device: "auto"          # "auto", "cuda" или "cpu"
    compute_type: "int8"    # int8 = минимум VRAM, влезает в 3GB
    language: null          # null = автоопределение, можно "ru"

audio:
  format: "wav"
  sample_rate: 16000
  channels: 1

screenshots:
  format: "jpg"
  quality: 95

keywords:
  triggers:
    - "на слайде"
    - "важно"
    - "обратите внимание"
    - "ключевой момент"
    - "запомните"

output:
  base_dir: "./output"

ai:
  # Список моделей и порядок их перебора (fallback): пробуем по порядку,
  # пока одна не ответит. Последняя в списке — платная.
  models:
    - "apodex/apodex-1.1-mini:free"
    - "dots-studio/dots-3-note-preview:free"
    - "nvidia/nemotron-3.5-lightning:free"
    - "~deepseek/deepseek-flash-latest"
