vosk:
  model_path: "./vosk/model-ru"
  # Режим работы: "local" - локальная модель, "server" - через сервер
  mode: "local"
  # Настройки для серверного режима
  server:
    url: "http://127.0.0.1:8000"
    timeout: 300  # секунды

audio:
  format: "wav"
  sample_rate: 16000
  channels: 1

screenshots:
  format: "jpg"
  quality: 95

keywords:
  triggers:
    - "на слайде"
    - "важно"
    - "обратите внимание"
    - "ключевой момент"
    - "запомните"

output:
  base_dir: "./output"
